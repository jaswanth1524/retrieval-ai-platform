# Docker's default json-file driver keeps container logs forever; on a long-running
# box that fills the disk. Rotated at 10 MB, three files per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  qdrant:
    # Pinned: server-side hybrid (prefetch + RRF fusion) depends on the Qdrant version,
    # and :latest silently changed it under an existing install on every pull.
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.19.1}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # Loopback only: the API reaches Qdrant over the compose network, and these ports
    # exist for running the API directly on the host (`uv run uvicorn ...`). Published
    # on 0.0.0.0 they let anyone on the LAN read or drop the collection, with no key —
    # around API_KEY entirely.
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    # To require a key (set QDRANT_API_KEY in .env too, so the API sends it):
    # environment:
    #   QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # /readyz (open even with an API key) answers 200 once collections are loaded; an
      # open TCP port only proved the process had started.
      test:
        - CMD-SHELL
        - >-
          timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333
          && printf "GET /readyz HTTP/1.0\r\n\r\n" >&3
          && read -r _ status _ <&3 && [ "$$status" = 200 ]'
      interval: 10s
      timeout: 6s
      retries: 12

  api:
    # The released image (ghcr.io, see .github/workflows/release.yml) when pulled, the one
    # built here otherwise: DOCRAG_PULL_POLICY=always with DOCRAG_VERSION=0.1.0 runs a
    # release without building. The default builds from source, as before.
    image: ghcr.io/jaswanth1524/retrieval-ai-platform:${DOCRAG_VERSION:-local}
    pull_policy: ${DOCRAG_PULL_POLICY:-build}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Optional uv extras baked into the image, e.g. UV_EXTRAS=ocr for scanned PDFs.
        UV_EXTRAS: ${UV_EXTRAS:-}
    restart: unless-stopped
    # Running ingests finish when the container is stopped (queued ones are failed), and
    # a large PDF can take minutes: Docker's default 10 s killed them midway.
    stop_grace_period: 60s
    logging: *default-logging
    # Hardened: the image is immutable at runtime. Writable places are only the model
    # cache volume, /app/data when its volume is mounted, and a tmpfs /tmp (upload
    # spooling). No Linux capabilities and no privilege gain: the process needs neither.
    # tmpfs is RAM, counted against mem_limit: a large POST /import upload or /export
    # zip spools there, so raise API_MEM_LIMIT by the backup's size to move big ones.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The reranker peaks around 1.4 GB with the default int8 model and 2.3-2.7 GB with fp32
    # (RERANKER_ONNX_FILE=; README "Latency"). A cap keeps a runaway request from taking
    # the whole Docker VM down with it; restart brings it back.
    mem_limit: ${API_MEM_LIMIT:-4g}
    env_file:
      - .env.example
      # Optional local override — copy .env.example to .env and set real secrets
      # (e.g. OPENAI_API_KEY) there; values here win over .env.example.
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      # Cold-start the embedding/reranker models at boot rather than on the first
      # real request — worth the extra startup time in a long-running container.
      WARMUP_MODELS: "true"
      # Same Docker network as Qdrant, so gRPC is reachable without extra config.
      QDRANT_PREFER_GRPC: "true"
    # Off by default: JOB_STORE_BACKEND=memory, RAW_DOCUMENT_DIR="" and
    # FEEDBACK_ENABLED=false (the .env.example defaults) mean ingest-job status is lost
    # on container recreate, uploaded originals aren't kept, and no feedback is
    # captured — same as every prior release. To opt into any of the three
    # (JOB_STORE_BACKEND=sqlite, a real RAW_DOCUMENT_DIR=./data/originals, and/or
    # FEEDBACK_ENABLED=true in .env), also uncomment the docrag_job_store line in
    # `volumes:` below: all three default to
    # paths under /app/data, so one mount covers them. The Dockerfile creates
    # /app/data owned by uid 1000, which is what makes the mounted volume writable by
    # the non-root process — without that, Docker seeds the volume root-owned.
    volumes:
      # Downloaded embedding/reranker models (~0.5 GB; ~1.3 GB with the fp32 reranker,
      # RERANKER_ONNX_FILE=). Without this every container
      # recreate — including each `docker compose up --build` — downloads them again.
      - model_cache:/home/app/.cache
      # - docrag_job_store:/app/data
    extra_hosts:
      # Lets OLLAMA_BASE_URL=http://host.docker.internal:... resolve on native Linux
      # Docker (Docker Desktop on macOS/Windows already resolves this automatically).
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      # Liveness only (probes /health, not /health/ready) — deliberately doesn't
      # depend on Ollama/Qdrant reachability, so a slow/unreachable Ollama can't
      # flap the container's own health status.
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      # First boot downloads the models (~0.5 GB) before /health answers; on a slow
      # link 120s marked a healthy container unhealthy. start_interval probes often
      # during that window, so a fast boot still reports healthy quickly.
      start_period: 600s
      start_interval: 5s
      retries: 3
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_storage:
  model_cache:
  # Only used if the commented-out mount under the api service is enabled.
  docrag_job_store:
