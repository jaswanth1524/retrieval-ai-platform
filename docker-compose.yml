services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.example
      # Optional local override — copy .env.example to .env and set real secrets
      # (e.g. OPENAI_API_KEY) there; values here win over .env.example.
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      # Cold-start the embedding/reranker models at boot rather than on the first
      # real request — worth the extra startup time in a long-running container.
      WARMUP_MODELS: "true"
      # Same Docker network as Qdrant, so gRPC is reachable without extra config.
      QDRANT_PREFER_GRPC: "true"
    # Off by default: JOB_STORE_BACKEND=memory and RAW_DOCUMENT_DIR="" (the
    # .env.example defaults) mean ingest-job status is lost on container recreate and
    # uploaded originals aren't kept, same as every prior release. To opt into either
    # (JOB_STORE_BACKEND=sqlite and/or a real RAW_DOCUMENT_DIR=./data/originals in
    # .env), also uncomment this volume — both features live under /app/data, so one
    # mount covers both. Must be writable by the container's non-root uid 1000
    # (Dockerfile creates user `app` with --uid 1000).
    # volumes:
    #   - docrag_job_store:/app/data
    extra_hosts:
      # Lets OLLAMA_BASE_URL=http://host.docker.internal:... resolve on native Linux
      # Docker (Docker Desktop on macOS/Windows already resolves this automatically).
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      # Liveness only (probes /health, not /health/ready) — deliberately doesn't
      # depend on Ollama/Qdrant reachability, so a slow/unreachable Ollama can't
      # flap the container's own health status.
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_storage:
  # Only used if the commented-out mount under the api service is enabled.
  docrag_job_store:
