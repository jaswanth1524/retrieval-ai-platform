services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.example
      # Optional local override — copy .env.example to .env and set real secrets
      # (e.g. OPENAI_API_KEY) there; values here win over .env.example.
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
    extra_hosts:
      # Lets OLLAMA_BASE_URL=http://host.docker.internal:... resolve on native Linux
      # Docker (Docker Desktop on macOS/Windows already resolves this automatically).
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_storage:
