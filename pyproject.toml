[project]
name = "docrag"
version = "0.1.0"
description = "Self-hostable document Q&A system with hybrid retrieval and grounded citations."
readme = "README.md"
# CI tests 3.12 and 3.13; the Docker image runs 3.12.
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [
  { name = "DocRAG contributors" }
]
# Lower bounds track the versions uv.lock was last tested with; the lock is what CI and
# the Docker image install, so older versions are not tested.
dependencies = [
  "fastapi>=0.138",
  "fastembed>=0.8",
  "litellm>=1.89",
  "prometheus-client>=0.25.0",
  "pydantic-settings>=2.14",
  "pypdf>=6.20.1",
  # Document format parsers. python-docx: the only maintained pure-Python DOCX reader,
  # needed for heading structure (citation sections). beautifulsoup4: robust HTML text
  # extraction over malformed markup (stdlib parser backend, no lxml). pdfplumber: PDF
  # table extraction via pdfminer layout analysis (pypdf has none; pypdf stays the text
  # path). See api/documents.py.
  "python-docx>=1.2",
  "beautifulsoup4>=4.15",
  "pdfplumber>=0.11.10",
  # Spreadsheets and slide decks (api/parsers/xlsx.py, pptx.py). openpyxl reads XLSX
  # cell values without Excel; python-pptx reads slide text, tables and notes (its lxml
  # and Pillow dependencies are already here through python-docx and pdfplumber).
  "openpyxl>=3.1.5",
  "python-pptx>=1.0.2",
  "python-multipart>=0.0.32",
  "qdrant-client>=1.18",
  # Already present transitively via fastembed; declared explicitly because the chunker
  # loads the dense model's tokenizer directly to count subword tokens (api/chunking.py).
  "tokenizers>=0.23",
  # Also transitive (litellm, fastembed, qdrant-client), but api/ imports them directly:
  # httpx for timeout/connect errors (llm.py, provider_health.py), numpy for held
  # vectors (ingestion.py), grpc for Qdrant status codes (repository.py, errors.py).
  "httpx>=0.28",
  "numpy>=1.26",
  "grpcio>=1.73",
  "uvicorn[standard]>=0.49",
]

[project.optional-dependencies]
eval = [
  "ragas>=0.4,<1",
  # ragas unconditionally imports langchain_community.chat_models.vertexai at module
  # load (ragas/llms/base.py), but that submodule was removed in langchain-community
  # 0.4 — an unpinned install resolves to 0.4.x and `import ragas` crashes with
  # ModuleNotFoundError. Pin to the last 0.3.x line, which still ships it.
  "langchain-community>=0.3,<0.4",
]
# Optional OCR for scanned/image PDFs. Pure-Python ONNX (onnxruntime is already a
# fastembed dependency); when absent, scanned PDFs fail with a message pointing here.
ocr = [
  "rapidocr-onnxruntime>=1.4",
]
# Optional MCP server (cli/mcp_server.py): DocRAG's search, questions and summaries as
# tools for MCP clients (Claude Desktop, IDE agents). Talks to the REST API like the CLI.
mcp = [
  "mcp>=2.2,<3",
]
test = [
  "httpx>=0.27",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  # A deadlocked lock/thread test fails in 120 s instead of hanging the CI job.
  "pytest-timeout>=2.3",
  "pytest-cov>=5.0",
]
dev = [
  "docrag[eval,mcp,test]",
  "mypy>=1.13",
  "ruff>=0.7",
]

[tool.uv]
package = false
# fastembed (every release up to 0.9.0) caps pillow<13, while 12.3.0 carries two dozen
# advisories fixed only in 13.0.0. fastembed uses Pillow for its image models only;
# DocRAG loads text embedding and reranking models. The PDF (pdfplumber), PPTX and OCR
# parsers are Pillow's real users here, and run with Pillow 13. Drop this once fastembed
# allows it.
override-dependencies = ["pillow>=13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
timeout = 120

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true

# Third-party document parsers without bundled type stubs. grpc is here for the same
# reason: it ships none, and it's only touched to classify Qdrant gRPC transport
# failures (api/main.py's vector_store_transport_handler).
[[tool.mypy.overrides]]
module = ["docx.*", "bs4.*", "pdfplumber.*", "rapidocr_onnxruntime.*", "grpc.*", "openpyxl.*"]
ignore_missing_imports = true

