[project]
name = "docrag"
version = "0.1.0"
description = "Self-hostable document Q&A system with hybrid retrieval and grounded citations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "DocRAG contributors" }
]
dependencies = [
  "fastapi>=0.115",
  "fastembed>=0.4",
  "litellm>=1.50",
  "prometheus-client>=0.25.0",
  "pydantic-settings>=2.6",
  "pypdf>=5.0",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.12",
  "qdrant-client>=1.12",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
eval = [
  "ragas>=0.2",
]
test = [
  "httpx>=0.27",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]
dev = [
  "docrag[eval,test]",
  "mypy>=1.13",
  "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true

