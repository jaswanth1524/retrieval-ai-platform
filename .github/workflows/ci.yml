name: CI

on:
  push:
    branches: [main]
  # Every pull request, not just those targeting main. Restricting the base to main
  # meant a stacked PR (feature branch -> an unmerged fix branch) ran no CI at all,
  # which is exactly when review needs it most.
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy api

      - name: Import eval extra
        # ragas has previously broken on import alone (an unpinned transitive
        # langchain-community resolved to a version missing a module ragas imports
        # unconditionally) while --validate-only below never touches the ragas
        # package at all — this step exists specifically to catch that class of
        # regression before it reaches "the eval extra silently doesn't work."
        run: uv run python -c "import ragas"

      - name: Validate eval dataset
        run: uv run python -m eval.ragas_runner eval/datasets/sample_eval.jsonl --validate-only

      - name: Audit runtime dependencies
        # What the image ships (core deps) plus the optional OCR extra — the parsers
        # here read untrusted uploads. The eval extra is excluded: it never ships, and
        # ragas carries advisories with no fixed release to move to.
        run: |
          uv export --frozen --extra ocr --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Audit runtime dependencies
        # Runtime packages only (what the browser loads); build/test tooling advisories
        # never reach a user and are left to Dependabot.
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # After the cheaper frontend gates, so a type/lint/unit failure surfaces first.
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        # The browser binary is cached; the OS libraries it links against are not.
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E (production build, mocked API)
        # playwright.config.ts's webServer builds and serves the prod bundle; the API
        # is mocked per test, so no Qdrant, models or LLM are needed. CI=true (set by
        # Actions) turns on forbidOnly, 1 retry to detect flakes, and the HTML report.
        run: npm run e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build-only: running the image would download the reranker + embedding models,
      # which isn't worth paying for on every CI run.
      - name: Build image
        run: docker build -t docrag:ci .
