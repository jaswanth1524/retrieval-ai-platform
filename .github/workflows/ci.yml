name: CI

on:
  push:
    branches: [main]
  # Every pull request, not just those targeting main. Restricting the base to main
  # meant a stacked PR (feature branch -> an unmerged fix branch) ran no CI at all,
  # which is exactly when review needs it most.
  pull_request:

# Read-only token: no job here writes to the repository.
permissions:
  contents: read

# A new push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the Docker image runs; 3.13 keeps requires-python honest.
        python-version: ["3.12", "3.13"]
    name: backend (python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # --locked fails on a uv.lock that has drifted from pyproject.toml; without it
        # CI quietly re-resolved, while the Docker image (uv sync --frozen) installed
        # the stale lock as-is.
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy api eval

      - name: Import eval extra
        # ragas has previously broken on import alone (an unpinned transitive
        # langchain-community resolved to a version missing a module ragas imports
        # unconditionally) while --validate-only below never touches the ragas
        # package at all — this step exists specifically to catch that class of
        # regression before it reaches "the eval extra silently doesn't work."
        run: uv run python -c "import ragas"

      - name: Validate eval datasets
        run: |
          uv run python -m eval.ragas_runner eval/datasets/sample_eval.jsonl --validate-only
          uv run python -m eval.harness validate eval/datasets/retrieval_eval.sample.jsonl
          uv run python -m eval.harness validate eval/datasets/handbook_eval.jsonl

      - name: Audit runtime dependencies
        # Once: the lockfile is the same on every Python version.
        if: matrix.python-version == '3.12'
        # What the image ships (core deps) plus the optional OCR extra — the parsers
        # here read untrusted uploads. The eval extra is excluded: it never ships, and
        # ragas carries advisories with no fixed release to move to.
        run: |
          uv export --frozen --extra ocr --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"

  qdrant:
    # The unit suite runs Qdrant in-process (":memory:"), which never exercises the
    # server's own hybrid query, its IDF modifier, or payload indexes. This runs the
    # server-only tests against the same Qdrant version compose pins, over REST and gRPC.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
          - 6334:6334
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Wait for Qdrant
        run: |
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:6333/readyz && exit 0
            sleep 1
          done
          exit 1

      - name: Server-only Qdrant tests
        env:
          DOCRAG_TEST_QDRANT_URL: http://127.0.0.1:6333
          DOCRAG_TEST_QDRANT_GRPC_PORT: "6334"
        run: uv run pytest tests/test_qdrant_server.py -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Audit runtime dependencies
        # Runtime packages only (what the browser loads); build/test tooling advisories
        # never reach a user and are left to Dependabot.
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # After the cheaper frontend gates, so a type/lint/unit failure surfaces first.
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        # The browser binary is cached; the OS libraries it links against are not.
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E (production build, mocked API)
        # playwright.config.ts's webServer builds and serves the prod bundle; the API
        # is mocked per test, so no Qdrant, models or LLM are needed. CI=true (set by
        # Actions) turns on forbidOnly, 1 retry to detect flakes, and the HTML report.
        run: npm run e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: docrag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Booted, not just built: a missing runtime dependency or an import error used to
      # ship unnoticed. WARMUP_MODELS=false keeps model downloads out of CI, and /health
      # touches neither the models nor Qdrant.
      - name: Boot image and probe /health
        run: |
          docker run -d --name docrag-ci -p 8000:8000 -e WARMUP_MODELS=false docrag:ci
          for _ in $(seq 60); do
            if curl -fsS http://127.0.0.1:8000/health; then
              curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
              exit 0
            fi
            sleep 1
          done
          docker logs docrag-ci
          exit 1
