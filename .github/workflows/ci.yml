name: CI

on:
  push:
    branches: [main]
  # Every pull request, not just those targeting main. Restricting the base to main
  # meant a stacked PR (feature branch -> an unmerged fix branch) ran no CI at all,
  # which is exactly when review needs it most.
  pull_request:

# Read-only token: no job here writes to the repository.
permissions:
  contents: read

# A new push to the same PR supersedes the run in progress. Not on main: two merges in
# a row cancelled the first one's run, and the build caches it would have saved.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit (the tag is kept as a comment): the docker job writes the
# build cache the release build reads, so a moved tag here could reach a release.

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the Docker image runs; 3.13 keeps requires-python honest.
        python-version: ["3.12", "3.13"]
    name: backend (python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # --locked fails on a uv.lock that has drifted from pyproject.toml; without it
        # CI quietly re-resolved, while the Docker image (uv sync --frozen) installed
        # the stale lock as-is.
        run: uv sync --locked --extra dev

      - name: Run tests
        # Coverage on one leg only: the numbers are the same on both, and it slows the run.
        run: >-
          uv run pytest
          ${{ matrix.python-version == '3.12' && '--cov=api --cov=eval --cov-report=term-missing:skip-covered' || '' }}

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy api eval

      - name: Import eval extra
        # ragas has previously broken on import alone (an unpinned transitive
        # langchain-community resolved to a version missing a module ragas imports
        # unconditionally) while --validate-only below never touches the ragas
        # package at all — this step exists specifically to catch that class of
        # regression before it reaches "the eval extra silently doesn't work."
        run: uv run python -c "import ragas"

      - name: Validate eval datasets
        run: |
          uv run python -m eval.ragas_runner eval/datasets/sample_eval.jsonl --validate-only
          uv run python -m eval.harness validate eval/datasets/retrieval_eval.sample.jsonl
          uv run python -m eval.harness validate eval/datasets/handbook_eval.jsonl

      - name: Audit runtime dependencies
        # Once: the lockfile is the same on every Python version.
        if: matrix.python-version == '3.12'
        # What the image ships (core deps) plus the optional OCR extra — the parsers
        # here read untrusted uploads. The eval extra is excluded: it never ships, and
        # ragas carries advisories with no fixed release to move to.
        run: |
          uv export --frozen --extra ocr --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"

  qdrant:
    # The unit suite runs Qdrant in-process (":memory:"), which never exercises the
    # server's own hybrid query, its IDF modifier, or payload indexes. This runs the
    # server-only tests against the same Qdrant version compose pins, over REST and gRPC.
    runs-on: ubuntu-latest
    # First run downloads the models (~0.5 GB); later runs restore them from cache.
    timeout-minutes: 30
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
          - 6334:6334
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # Tests only: the eval extra (ragas, langchain) is for RAGAS, not this job.
        run: uv sync --locked --extra test

      - name: Wait for Qdrant
        run: |
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:6333/readyz && exit 0
            sleep 1
          done
          exit 1

      - name: Server-only Qdrant tests
        env:
          DOCRAG_TEST_QDRANT_URL: http://127.0.0.1:6333
          DOCRAG_TEST_QDRANT_GRPC_PORT: "6334"
        run: uv run pytest tests/test_qdrant_server.py -v

      - name: Name the models to cache
        # Keyed on what is downloaded — the model names, the reranker's ONNX export and the
        # fastembed that fetches them — not on a file whose every edit threw away
        # ~0.5 GB, while a fastembed upgrade kept stale ones.
        id: models
        run: |
          key=$(uv run python -c "
          import importlib.metadata as m
          from api.settings import AppSettings as S
          s = S(_env_file=None)
          parts = [s.dense_embedding_model, s.sparse_embedding_model, s.reranker_model,
                   s.reranker_onnx_file, m.version('fastembed')]
          print('-'.join(parts).replace('/', '_'))
          ")
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache embedding and reranker models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/fastembed
            ~/.cache/huggingface
          key: models-${{ runner.os }}-${{ steps.models.outputs.key }}

      # The retrieval eval (eval/harness.py) against real models and a real Qdrant: the
      # handbook corpus, split small so each section is its own chunk, scored at file
      # and chunk level and compared with the committed baseline. Same settings the
      # baseline was made with (see its fingerprint). The baseline is from linux/amd64:
      # int8 ONNX scores differ slightly by CPU, enough to reorder one borderline
      # question (macOS arm64 scores it 0.947 hit@1, Linux 0.895). 0.06 allows that one
      # question (1/19 = 0.053) and fails on two.
      - name: Retrieval eval vs baseline
        env:
          LITELLM_MODE: PRODUCTION
          QDRANT_URL: http://127.0.0.1:6333
          QDRANT_COLLECTION: eval_handbook
          CHUNK_SIZE_TOKENS: "48"
          CHUNK_OVERLAP_TOKENS: "8"
          MIN_SECTION_WORDS: "0"
        run: |
          # The cached directory (env values aren't shell-expanded, so set here).
          export FASTEMBED_CACHE_PATH="$HOME/.cache/fastembed"
          uv run python -m eval.harness ingest eval/corpus_handbook
          uv run python -m eval.harness retrieval eval/datasets/handbook_eval.jsonl \
            --baseline eval/baselines/handbook_reranked.json --max-regression 0.06 \
            --output eval-results.json

      - name: Upload eval results
        # Also on a regression: the numbers are what a baseline refresh is made from.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-results
          path: eval-results.json
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Audit runtime dependencies
        # Runtime packages only (what the browser loads); build/test tooling advisories
        # never reach a user and are left to Dependabot.
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # After the cheaper frontend gates, so a type/lint/unit failure surfaces first.
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        # The browser binary is cached; the OS libraries it links against are not.
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E (production build, mocked API)
        # playwright.config.ts's webServer builds and serves the prod bundle; the API
        # is mocked per test, so no Qdrant, models or LLM are needed. CI=true (set by
        # Actions) turns on forbidOnly, 1 retry to detect flakes, and the HTML report.
        run: npm run e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: docrag:ci
          # Its own scope: the release build reads `release`, so what CI writes can't
          # reach a published image.
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max

      # Booted the way users run it — compose, with the read-only filesystem, dropped
      # capabilities and a real Qdrant — not just `docker run`: a missing runtime
      # dependency, an import error or a write the hardening forbids used to ship
      # unnoticed. WARMUP_MODELS=false (compose.ci.yml) keeps model downloads out of CI.
      - name: Boot the compose stack
        env:
          COMPOSE_FILES: -f docker-compose.yml -f .github/ci/compose.ci.yml
        run: |
          docker compose $COMPOSE_FILES up -d --no-build --wait --wait-timeout 180

      - name: Probe the running stack
        run: |
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
          # /health/ready answers 503 with no Ollama here; the body still says whether
          # Qdrant is reachable and the index matches.
          ready=$(curl -sS http://127.0.0.1:8000/health/ready)
          echo "$ready"
          echo "$ready" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["qdrant"] is True and d["index_compatible"] is True, d'
          # The image reports the version it was built from (api/version.py reads
          # pyproject.toml, which must be copied into the image).
          expected=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          reported=$(curl -fsS http://127.0.0.1:8000/openapi.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])')
          test "$reported" = "$expected" || { echo "image reports $reported, pyproject says $expected"; exit 1; }

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f .github/ci/compose.ci.yml logs --no-color

  docker-ocr:
    # The OCR variant adds apt packages the default image doesn't have; build it (not
    # boot it) on main so a broken UV_EXTRAS=ocr path doesn't wait for a user to hit it.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image with OCR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          build-args: UV_EXTRAS=ocr
          tags: docrag:ci-ocr
          cache-from: type=gha,scope=ci-ocr
          cache-to: type=gha,scope=ci-ocr,mode=max
