name: Release

# Pushing a version tag (v0.2.0) publishes the image to GHCR, signs it, scans it, and
# opens a GitHub release whose notes are that version's CHANGELOG.md section. Tag the
# commit whose pyproject.toml `version` matches the tag; the build refuses otherwise.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # the GitHub release
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing (Sigstore OIDC)
      security-events: write # Trivy results in the Security tab
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      # Actions pinned by commit; Dependabot (github-actions ecosystem) bumps them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Tag matches pyproject version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build provenance and an SBOM, attached to the image as attestations.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the image (keyless)
        # Signed by digest, so the signature covers exactly what was pushed. Verify with:
        # cosign verify ghcr.io/<owner>/<repo>@<digest> \
        #   --certificate-identity-regexp 'https://github.com/<owner>/<repo>/' \
        #   --certificate-oidc-issuer https://token.actions.githubusercontent.com
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Scan the image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: trivy.sarif

      - name: GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The "## <version>" section, up to the next "## " heading.
          awk -v v="$version" '
            $0 ~ "^## " { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md." > notes.md
          fi
          {
            echo
            echo "Image: \`${IMAGE}:${version}\` (\`${{ steps.build.outputs.digest }}\`), signed with cosign."
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
